
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #e0f2fe);
        }

        .welcome-box {
            width: 70%;
            padding: 50px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #4f46e5;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>Welcome!</h1>

        <p>You have successfully reached the welcome page.</p>

        <a href="login.html">Back to Login</a>

    </div>

</body>
</html>
